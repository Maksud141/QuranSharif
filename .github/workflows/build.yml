name: QuranSharif Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:

      # =====================================================
      # 1. Checkout source code
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Java 17
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # 3. Setup Gradle
      # =====================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =====================================================
      # 4. Restore signing keystore
      # =====================================================
      - name: Decode signing keystore
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/quransharif-upload.jks


      # =====================================================
      # 5. Verify keystore exists
      # =====================================================
      - name: Verify signing keystore
        shell: bash
        run: |
          test -s app/quransharif-upload.jks
          echo "Signing keystore restored successfully."


      # =====================================================
      # 6. Build signed Release APK
      # =====================================================
      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon


      # =====================================================
      # 7. Build signed Release AAB
      # =====================================================
      - name: Build Release AAB
        run: |
          gradle bundleRelease --no-daemon


      # =====================================================
      # 8. Verify output files
      # =====================================================
      - name: Verify APK and AAB
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

          echo "======================================"
          echo "SIGNED APK:"
          ls -lh app/build/outputs/apk/release/app-release.apk

          echo "======================================"
          echo "SIGNED AAB:"
          ls -lh app/build/outputs/bundle/release/app-release.aab
          echo "======================================"


      # =====================================================
      # 9. Upload APK + AAB
      # =====================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: QuranSharif-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7


      # =====================================================
      # 10. Remove signing keystore from runner
      # =====================================================
      - name: Remove signing keystore
        if: always()
        shell: bash
        run: |
          rm -f app/quransharif-upload.jks
