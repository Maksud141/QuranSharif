name: Build Quran Sharif APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Setup Android SDK
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true


      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # 6. Build Release APK
      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon


      # 7. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranSharif-release-apk
          path: app/build/outputs/apk/release/*.apk
